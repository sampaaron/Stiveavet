# Mises à jour des actions épinglées par SHA et des images épinglées par empreinte (ADR 0041).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: ["/docker"]
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directories: ["/docker"]
    schedule:
      interval: weekly
