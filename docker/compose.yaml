# Environnement local Stivea Vet : données fictives uniquement, aucun service externe.
# Usage : cp .env.example .env (puis renseigner les trois mots de passe), puis
#         docker compose -f docker/compose.yaml --env-file .env up --build
#         pnpm db:migrate && pnpm db:seed   (depuis la machine hôte)
name: stivea-vet

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      APP_ENV: local
      APP_URL: http://localhost:3000
      # Rôle applicatif : ni propriétaire du schéma, ni BYPASSRLS (voir docs/adr/0006).
      DATABASE_URL: postgres://stivea_app:${STIVEA_APP_PASSWORD:?Renseigner STIVEA_APP_PASSWORD dans .env}@db:5432/stivea
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      db-roles:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1001,gid=1001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Renseigner POSTGRES_ADMIN_PASSWORD dans .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Crée les rôles stivea_migrator / stivea_app et la base (idempotent), puis s'arrête.
  db-roles:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Renseigner POSTGRES_ADMIN_PASSWORD dans .env}
      MIGRATOR_PASSWORD: ${STIVEA_MIGRATOR_PASSWORD:?Renseigner STIVEA_MIGRATOR_PASSWORD dans .env}
      APP_PASSWORD: ${STIVEA_APP_PASSWORD:?Renseigner STIVEA_APP_PASSWORD dans .env}
    volumes:
      - ../db/bootstrap:/bootstrap:ro
    command:
      - sh
      - -c
      - >-
        psql -v migrator_password="$$MIGRATOR_PASSWORD" -v app_password="$$APP_PASSWORD"
        -v database=stivea -f /bootstrap/roles.sql
    restart: "no"

  # Capture tous les e-mails (codes de sécurité, factures…) : rien ne sort de la machine.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

volumes:
  db-data:
